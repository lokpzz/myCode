<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            
            box-sizing: border-box;
        }
        body{
            background-color: #f1f1f1;
        }
        .box{
            /* Display mode */
            display: block;

            /* Dimensions */
            width: 270px; 
            height: 253px; 
            /* Positioning (margin) */
            margin: 50px auto; 
            padding: 140px 0;
            /* Background styles */
            background-color: #fff; 
            background-image: url(./images/liveSDK.svg); 
            background-repeat: no-repeat;
            background-position: center 40px; 
            /* Border style */
            border-radius: 10px; 
            /* font */
            text-align: center;
        }
        .box h4{
            color: #333;
            font-size: 18px;
            /* position */
            margin-top: 0px;
            margin-bottom: 12px;
        }
        .box p{
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h4>抖音直播SDK</h4>
        <p>包含抖音直播看播功能</p>
    </div>
    



    
</body>
</html>
