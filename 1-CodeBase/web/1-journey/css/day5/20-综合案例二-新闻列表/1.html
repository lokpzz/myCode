<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #fff;
        }
        .box {
          /* Layout */
          display: block;

          width: 360px;
          height: 182px;
          margin: 100px auto;
          /* padding: ; */
        
          /* Box */
          /* border: 1px solid #eee; */
          border-radius: 4px;
          box-shadow: none;
        
          /* Background */
          background: #fff;
        }

        ul{
          /* Layout */
          display: block;
          /* width: 100px; */
          height: 34px;
          margin: 0;
          padding: 0;

          /* Background */
          background: #eeeeee;
        }
       
        li {
          list-style: none;
        }
        a{
          text-decoration: none;
        }
         ul>a{
          /* Layout */
          display: block;
          width: 50px;
          height: 34px;
          margin: 0;
          padding: 0;
        
          /* Box */
          border-top: 3px solid #ff8400;
          /* border-radius: 4px;
          box-shadow: none; */
        
          /* Background */
          background: #fff;
          /* Text */
          font-size: 14px;
          font-weight: 400;
          color: #555;
          line-height: 34px;
          text-align: center;
          text-decoration: none;
        }
        
        ul li{
            padding-left: 15px;
            background: #fff;
            background: url(./images/square.png) no-repeat 0 center;
        }
        ul li a{
            padding-left: 20px;
            background: #fff;
            background: url(./images/img.gif) no-repeat 0 center;
            /* Text */
            font-size: 14px;
            font-weight: 400;
            color: #333;
            line-height: 1.5;
            text-align: left;
            text-decoration: none;
            
        }
    </style>
</head>
<body>
    <div class="box">
        <ul><a href="#">新闻</a>
            <li><a href="#">点赞“新权人”温暖的伸手</a></li>
            <li><a href="#">在希望的田野上.</a></li>
            <li><a href="#">1涵哭眼”又有新发现已在《自然》杂志发表</a></li>
            <li><a href="#">急！这个领域，缺人！月薪4万元还不好招！啥情况？</a></li>
            <li><a href="#">G9“带货”背后：亏损面持续扩大，竞争环境激烈</a></li>
            <li><a href="#">多地力推上手房“带押过户”，有什么好处？</a></li>
        </ul> 
    </div>
</body>
</html>
